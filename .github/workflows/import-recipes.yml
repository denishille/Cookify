name: Rezepte importieren

# Nur manuell. Holt Rezeptbilder (oder ganze Rezepte) von den Quellseiten und committet sie.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Rezept-IDs, kommagetrennt: Bild der Quellseite holen (leer = alle mit Quelle und ohne Bild)'
        required: false
      urls:
        description: 'Rezept-URLs, durch Leerzeichen getrennt: neue Rezepte als Entwurf holen (mit Bild)'
        required: false
      ratings:
        description: 'true = Bewertungen für Rezepte ohne Bewertung nachziehen'
        required: false
      file:
        description: 'Pfad zu einer Datei im Repo mit einer URL je Zeile, z. B. scripts/queue/i1.txt'
        required: false
      probe:
        description: 'URLs (durch Leerzeichen getrennt) nur untersuchen: wie liefert die Seite ihre Rezeptdaten?'
        required: false
      probe_match:
        description: 'Beim Untersuchen nur Zeilen ausgeben, die auf dieses Muster passen'
        required: false
      probe_after:
        description: 'Zusätzlich so viele Zeilen nach jedem Treffer ausgeben'
        required: false
      rewrite:
        description: 'true = wartende Entwürfe in src/data/imports/ in App-Rezepte umschreiben'
        required: false
      collect:
        description: 'Übersichtsseiten (durch Leerzeichen getrennt), aus denen Rezept-Links gesammelt werden'
        required: false
      collect_out:
        description: 'Zieldatei für die gesammelten Links, z. B. scripts/queue/hellofresh.txt'
        required: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quellseite untersuchen
        if: ${{ github.event.inputs.probe != '' }}
        run: DUMP=1 DUMP_MATCH="${{ github.event.inputs.probe_match }}" DUMP_AFTER="${{ github.event.inputs.probe_after }}" node scripts/probe-url.mjs ${{ github.event.inputs.probe }}
      - name: Links sammeln
        if: ${{ github.event.inputs.collect != '' }}
        run: node scripts/collect-urls.mjs --out "${{ github.event.inputs.collect_out }}" ${{ github.event.inputs.collect }}
      - name: Bewertungen nachziehen
        if: ${{ github.event.inputs.ratings == 'true' }}
        run: node scripts/import-recipes.mjs --ratings
      - name: Bilder holen
        if: ${{ github.event.inputs.urls == '' && github.event.inputs.ratings != 'true' && github.event.inputs.file == '' && github.event.inputs.probe == '' && github.event.inputs.rewrite != 'true' && github.event.inputs.collect == '' }}
        run: |
          if [ -n "${{ github.event.inputs.ids }}" ]; then
            node scripts/import-recipes.mjs --images-for "${{ github.event.inputs.ids }}"
          else
            node scripts/import-recipes.mjs --images-all
          fi
      - name: Rezepte holen
        if: ${{ github.event.inputs.urls != '' }}
        run: node scripts/import-recipes.mjs --with-images --limit 400 --urls ${{ github.event.inputs.urls }}
      - name: Rezepte aus Datei holen
        if: ${{ github.event.inputs.file != '' }}
        run: node scripts/import-recipes.mjs --with-images --limit 400 --file "${{ github.event.inputs.file }}"
      - name: Entwürfe umschreiben
        if: ${{ github.event.inputs.rewrite == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ANTHROPIC_API_KEY ist nicht als Secret hinterlegt."; exit 1; fi
          node scripts/import-recipes.mjs --rewrite
      - name: Committen
        run: |
          for p in src/assets/recipes src/data/imports src/data/sources src/data/recipes scripts/queue; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git config user.name "cookify-bot"
          git config user.email "cookify-bot@users.noreply.github.com"
          git commit -m "Import: Rezeptbilder und Entwürfe von Quellseiten"
          # Mehrere Importläufe können gleichzeitig pushen: notfalls neu aufsetzen und erneut versuchen.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "Push nach fünf Versuchen fehlgeschlagen." >&2
          exit 1
