name: CI

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-recipes.mjs
      - run: npx tsx scripts/check-diet-rules.mjs
      - run: npm run lint
      - run: npm run build
